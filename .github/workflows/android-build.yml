name: Build Android APK

on:
  push:
    branches: [ "claude/vigilant-thompson-knfo19", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NederLeer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NederLeer-APK
          path: dist/NederLeer.apk
          if-no-files-found: error

      - name: Publish to "latest-apk" release
        if: github.ref == 'refs/heads/claude/vigilant-thompson-knfo19'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: NederLeer · ultima APK
          body: |
            APK di debug installabile dell'app NederLeer (impara l'olandese).
            Generata automaticamente dall'ultimo commit.
          files: dist/NederLeer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
